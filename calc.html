<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple Calculator</title>
    <style>
        body {font-family: Arial, sans-serif; margin: 2rem;}
        .calc {max-width: 400px; margin: auto;}
        label, input, select {display: block; width: 100%; margin-bottom: 1rem;}
        button {width: 100%; padding: 0.5rem;}
        #result {font-weight: bold; margin-top: 1rem;}
    </style>
</head>
<body>
    <div class="calc">
        <h2>Basic Calculator</h2>
        <label for="num1">Number 1:</label>
        <input type="number" id="num1" step="any" />
        
        <label for="num2">Number 2:</label>
        <input type="number" id="num2" step="any" />
        
        <label for="op">Operation:</label>
        <select id="op">
            <option value="add">Addition (+)</option>
            <option value="sub">Subtraction (−)</option>
            <option value="mul">Multiplication (×)</option>
            <option value="div">Division (÷)</option>
        </select>
        
        <button type="button" onclick="calculate()">Calculate</button>
        <div id="result"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
